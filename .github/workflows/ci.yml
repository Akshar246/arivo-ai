name: CI

# Runs on every push to main and every pull request. Nothing here uses real API keys:
# the tests never call the language model or the job APIs, so a pull request from a fork
# can run it safely and no secret can leak through it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push cancels the run for the older one on the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Dependency audit (fails on high or critical)
        run: npm audit --omit=dev --audit-level=high

  backend:
    name: Backend (tests, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Every source file parses
        run: find . -name "*.js" -not -path "./node_modules/*" -print0 | xargs -0 -n1 node --check
      - name: Tests
        run: npm test
      - name: Dependency audit (fails on high or critical)
        run: npm audit --omit=dev --audit-level=high

  ai-service:
    name: AI service (tests, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    env:
      # Placeholders: the tests never reach the language model or the job APIs
      GROQ_API_KEY: placeholder-not-a-real-key
      REED_API_KEY: placeholder-not-a-real-key
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements.docker.txt
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2
      - name: Install
        run: pip install pytest pip-audit -r requirements.docker.txt
      - name: Tests
        run: pytest tests/ -q
      - name: Dependency audit
        # chromadb has published advisories with no fixed release yet. It runs embedded in the
        # service and is not exposed as a server. Accepted for now; see docs/security.md.
        run: >
          pip-audit -r requirements.docker.txt
          --ignore-vuln PYSEC-2026-311
          --ignore-vuln PYSEC-2026-3813
          --ignore-vuln PYSEC-2026-3814
          --ignore-vuln PYSEC-2026-3815

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
